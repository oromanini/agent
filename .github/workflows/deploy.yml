name: Deploy (Hostinger)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            PHP_BIN="${{ vars.PHP_BIN || 'php' }}"
            COMPOSER_BIN="${{ vars.COMPOSER_BIN || 'composer' }}"

            echo "==> Deploying to $DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo "==> Fetching latest master"
            git fetch --prune origin master
            git reset --hard origin/master

            echo "==> Installing PHP dependencies"
            # Servidor roda PHP 8.1; composer.json da master pede ^8.2 (ver docs/deploy.md)
            $COMPOSER_BIN install --no-dev --prefer-dist --optimize-autoloader \
              --no-interaction --no-progress --ignore-platform-req=php

            echo "==> Laravel: limpa caches e reinicia workers"
            # migrations NÃO são aplicadas aqui: a tabela `migrations` do servidor
            # está fora de sincronia com o schema. Rodar na mão. Ver docs/deploy.md.
            # route:cache/config:cache não são usados: o app tem nome de rota
            # duplicado ([logout]) que impede o route caching.
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan view:cache || true
            $PHP_BIN artisan storage:link || true
            $PHP_BIN artisan queue:restart || true

            echo "==> Done"
